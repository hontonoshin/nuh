name: Build desktop executables

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            py: '3.11'
            use_system_python: false
          - os: ubuntu-latest
            py: 'system'
            use_system_python: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Windows: use setup-python
      - name: Set up Python (Windows)
        if: matrix.use_system_python == false
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      # --- Linux: use system Python + install Tk for it
      - name: Install system packages (Linux)
        if: matrix.use_system_python == true
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-tk patchelf

      # Upgrade pip and install deps (use the right interpreter per-OS)
      - name: Install Python deps
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            python3 -m pip install --upgrade pip wheel
            python3 -m pip install -r requirements.txt
          else
            python -m pip install --upgrade pip wheel
            pip install -r requirements.txt
          fi
        shell: bash

      # Build with PyInstaller using the correct interpreter
      - name: Build with PyInstaller
        env:
          MPLBACKEND: TkAgg
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            python3 -m PyInstaller --noconfirm --clean --onefile --windowed \
              --name NuclearHydrogen main.py
          else
            pyinstaller --noconfirm --clean --onefile --windowed \
              --name NuclearHydrogen main.py
          fi
        shell: bash

      - name: List build outputs
        shell: bash
        run: |
          echo "Dist contents:"
          ls -lah dist || dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuclearHydrogen-${{ runner.os }}
          path: dist/**
