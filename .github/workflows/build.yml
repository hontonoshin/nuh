name: Build desktop executables

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: [ '3.11' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux-only system deps for TkAgg + PyInstaller
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk patchelf

      - name: Upgrade pip and install Python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name NuclearHydrogen main.py

      - name: List build outputs
        shell: bash
        run: |
          echo "Dist contents:"
          ls -lah dist || dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuclearHydrogen-${{ runner.os }}
          path: |
            dist/**
